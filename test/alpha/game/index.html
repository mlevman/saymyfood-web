<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>SayMyFood — Apple fight</title>
<link rel="icon" href="../../../brand/saymyfood-mark.png">
<link rel="stylesheet" href="../../../site.css">
<style>
html,body{height:100%}
body{--zone:clamp(144px,16vw,168px);--pad:8px;--gap:8px;
/* Everything in the margins is derived from the margin's own width and the height
   the viewport actually has, never from a measured device. --zw is the usable width
   once the padding is off it; --half is one of two controls side by side; --rsv is
   the held-open strip at the top of the left zone (a row of half-width buttons plus
   a 44px `up` bar), capped against the viewport so a short phone does not lose the
   play area to it; --bar is the gather bar. Every one of them clears 44px. */
--zw:calc(var(--zone) - var(--pad) * 2);--half:calc((var(--zw) - var(--gap)) / 2);
--rsv:min(calc(var(--half) + var(--gap) + 44px),24vh);--rsv:min(calc(var(--half) + var(--gap) + 44px),24dvh);
--bar:clamp(48px,11vh,84px);--bar:clamp(48px,11dvh,84px);--throw:clamp(56px,var(--zw),96px);
margin:0;background:#161616;color:var(--tx);font-family:var(--font);display:flex;flex-direction:column;overflow:hidden;touch-action:manipulation;-webkit-user-select:none;user-select:none}
.top{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;gap:10px;flex-shrink:0}
.top a{display:flex;align-items:center;gap:8px;color:var(--tx2);text-decoration:none;font-size:13px;font-weight:600}
.top a:hover{color:var(--tx)}
.top .mark{width:22px;height:22px}
.top .brd{color:var(--tx2);background:none;border:1px solid var(--hair2);border-radius:999px;padding:6px 12px;font:600 13px var(--font);cursor:pointer}
.arena{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:0 10px}
.frame{position:relative;width:min(100%,calc((100vh - 120px) * 16 / 9));width:min(100%,calc((100dvh - 120px) * 16 / 9));aspect-ratio:16/9;border:1px solid var(--hair);border-radius:14px;overflow:hidden;background:#141816}
canvas{display:block;width:100%;height:100%}
.ov{position:absolute;inset:0;display:flex;align-items:flex-start;justify-content:center;padding:14px;background:rgba(22,22,22,.86);backdrop-filter:blur(3px);overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;touch-action:pan-y;-webkit-overflow-scrolling:touch;z-index:3}
/* The box must not become its own scroller, or the drag stops at its edge. */
.ov>.box{touch-action:pan-y}
.ov[hidden]{display:none}
.box{max-width:440px;width:100%;text-align:center;margin:auto}
.box h2{margin:0 0 6px;font-size:clamp(18px,3vw,26px);letter-spacing:-.02em;font-weight:700}
.box p{margin:0 0 10px;color:var(--tx2);font-size:clamp(12.5px,1.8vw,14.5px);line-height:1.4;text-wrap:pretty}
.box .btn{padding:11px 22px;font-size:14px;border-radius:12px;min-width:150px}
.box .ghost{background:none;border:1px solid var(--hair2);color:var(--tx);padding:10px 20px;border-radius:12px;font:600 14px var(--font);cursor:pointer}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.heroes{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0 8px}
.hero{border:1px solid var(--hair2);border-radius:14px;padding:6px 8px;background:var(--card);cursor:pointer;color:var(--tx);font:inherit;transition:border-color .15s;display:flex;align-items:center;gap:8px;text-align:left}
.hero.on{border-color:var(--mint);box-shadow:0 0 0 2px var(--mint-dim)}
.hero canvas{display:block;flex-shrink:0;width:auto;height:clamp(48px,9vh,84px);height:clamp(48px,9dvh,84px);aspect-ratio:1}
.hero b{display:block;font-size:14px;line-height:1.2}
.hero small{display:block;color:var(--mint);font-size:11.5px;margin-top:3px;line-height:1.25}
.hard{display:flex;align-items:center;gap:10px;text-align:left;margin:0 0 10px;padding:7px 12px;border:1px solid var(--hair2);border-radius:12px;cursor:pointer;background:var(--card)}
.hard:has(input:checked){border-color:#F2717A;box-shadow:0 0 0 2px rgba(242,113,122,.20)}
.hard:has(input:checked) b{color:#F2717A}
.hard input{accent-color:#F2717A;width:18px;height:18px;margin:0;flex-shrink:0}
.hard b{display:block;font-size:14px}.hard small{display:block;font-size:12px;color:var(--tx2);line-height:1.35;margin-top:2px}
.stats{font-size:13.5px}.stats .sum{border-top:1px solid var(--hair2);padding-top:5px;margin-top:3px;color:var(--tx);font-weight:700}.stats .x2{grid-column:1/-1;color:#F2717A;font-weight:700;font-size:13px;margin-top:2px}
.stats{display:grid;grid-template-columns:auto auto;gap:4px 22px;justify-content:center;margin:0 0 16px;font-size:14px;color:var(--tx2)}
.stats b{color:var(--tx);text-align:right;font-variant-numeric:tabular-nums}
.big{font-size:clamp(30px,6vw,46px);font-weight:800;letter-spacing:-.03em;color:var(--mint);margin:2px 0 10px;font-variant-numeric:tabular-nums}
.name{display:flex;gap:8px;justify-content:center;margin:0 0 12px}
.name input{flex:1;max-width:220px;padding:10px 12px;font:500 15px var(--font);border-radius:11px;border:1px solid var(--hair2);background:var(--card);color:var(--tx)}
.name input:focus{outline:none;border-color:var(--mint)}
.list{max-height:min(50vh,300px);max-height:min(50dvh,300px);overflow:auto;text-align:left;margin:0 0 14px;border:1px solid var(--hair);border-radius:12px}
.list div{display:grid;grid-template-columns:34px 16px 1fr auto;gap:10px;padding:7px 12px;font-size:14px;border-bottom:1px solid var(--hair);font-variant-numeric:tabular-nums}
.list div:last-child{border-bottom:0}.list div.me{background:var(--mint-dim);color:var(--tx)}.list div.hard span:nth-child(3){color:#F2717A;font-weight:700}
.list .pf{display:flex;align-items:center;justify-content:center;color:var(--tx3)}
.list .pf svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.list div.me .pf{color:var(--tx2)}.list span:first-child{color:var(--tx3)}.list span:last-child{font-weight:700}
#e-list{max-height:min(34vh,210px);max-height:min(34dvh,210px)}
.note{font-size:12px;color:var(--tx3);margin:0 0 12px}
#t-how{margin:8px 0 0}
.lnk{background:none;border:0;padding:4px 0 0;color:var(--mint);font:600 12.5px var(--font);cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.rwlist{text-align:left;border:1px solid var(--hair);border-radius:12px;margin:0 0 14px}
.rwlist div{display:flex;align-items:baseline;justify-content:space-between;gap:14px;padding:8px 13px;font-size:13.5px;border-bottom:1px solid var(--hair)}
.rwlist div:last-child{border-bottom:0}.rwlist b{color:var(--mint);font-variant-numeric:tabular-nums;white-space:nowrap;flex-shrink:0}
.rwlist span{min-width:0;overflow-wrap:anywhere}
.rwlist div.x2 b{color:#F2717A}
/* On-screen controls. Landscape only, and only in the black margins beside the
   16:9 field: the whole fight happens in the bottom third of the field, so any
   control drawn over the canvas covers the game. */
.zone{display:none;position:absolute;top:0;bottom:0;width:var(--zone);z-index:2;padding:var(--pad);gap:var(--gap);
touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
/* A 3x3 grid of equal squares forces cell = zone_width / 3, and the margin is only
   about a fifth of a phone's landscape width - so there is nothing to win sideways.
   The room is vertical: the margin is free for the whole height of the screen while
   the old D-pad used less than a third of it. So: rows, not cells. Each track is a
   minmax with a 44px floor, so a narrow or short phone shrinks instead of breaking. */
.zone.l{left:0;grid-template-rows:minmax(44px,var(--rsv)) minmax(88px,1fr) minmax(44px,var(--bar))}
/* Nothing is drawn here. It holds height for movement buttons and `up`, which do not
   exist yet; keeping the room means adding them later moves nothing below it. */
.rsv{pointer-events:none}
/* left and right, side by side, each half the usable width and as tall as the zone
   allows. They carry almost all of the play, so they get almost all of the space. */
.lr{display:grid;grid-template-columns:1fr 1fr;gap:var(--gap);min-height:0;min-width:0}
/* Rounded squares and rounded rectangles: they pack into a rectangular margin in a
   way a circle cannot. */
.zone.l button{min-width:44px;min-height:44px;width:100%;height:100%;padding:0;cursor:pointer;
display:flex;align-items:center;justify-content:center;border-radius:16px;border:1px solid var(--hair2);
background:rgba(21,26,24,.78);color:var(--tx);font:700 20px var(--font);line-height:1;
touch-action:none;-webkit-tap-highlight-color:transparent;backdrop-filter:blur(3px)}
.zone.l button.act{background:var(--mint-dim);border-color:var(--mint)}
/* The right zone keeps its width. It is not cut down to one button: from round four
   on the game gains further actions and this is where they will live. Throw sits at
   the BOTTOM and that is permanent - the 1fr row above it is held open and drawn
   empty, so a button added there later does not move throw out from under the thumb. */
.zone.r{right:0;grid-template-rows:1fr auto}
.thr{width:var(--throw);height:var(--throw);min-width:44px;min-height:44px;padding:0;cursor:pointer;justify-self:center;
display:flex;align-items:center;justify-content:center;border:0;border-radius:24px;
background:rgba(143,220,192,.92);color:#0F1A15;touch-action:none;-webkit-tap-highlight-color:transparent}
.thr svg{width:58%;height:58%;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.thr.act{filter:brightness(1.14);transform:scale(.96)}
.touchhint{display:none}
.keys{font-size:12px;color:var(--tx3);text-align:center;padding:6px 0 10px;flex-shrink:0}
.rot{display:none;position:absolute;inset:0;z-index:4;background:#161616;color:var(--tx2);align-items:center;justify-content:center;text-align:center;padding:30px;font-size:15px;line-height:1.5}
.rot svg{display:block;margin:0 auto 14px;stroke:var(--mint);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.rot small{display:block;margin-top:12px;color:var(--tx3);font-size:13px}
@media(pointer:coarse){.keys{display:none}.touchhint{display:block;margin:8px 0 0}.top{padding:6px 10px}.arena{padding:0 6px 6px}.frame{width:min(100%,calc((100vh - 60px) * 16 / 9));width:min(100%,calc((100dvh - 60px) * 16 / 9))}}
/* The zones sit in the margins, so the arena is padded by exactly their width and
   the frame centres in what is left. The field never ends up under a control. */
@media(pointer:coarse) and (orientation:landscape){.arena{padding:0 var(--zone) 6px}.zone.l,.zone.r{display:grid}}
/* No live controls while a screen is up. Wins on specificity, whatever the order. */
.arena:has(.ov:not([hidden])) .zone{display:none}
/* Short landscape - a phone, with or without fullscreen. The overlay is wide and
   not tall, so: two columns where a column actually buys height, smaller type,
   and the box is allowed to use the width it has. Desktop never sees any of this. */
@media (orientation:landscape) and (max-height:520px){
.box{max-width:none}
.box h2{font-size:16.5px;margin:0 0 3px}
.box p{font-size:11.5px;line-height:1.35;margin:0 0 5px}
.note{font-size:10.5px;margin:0 0 6px}
.box .btn{padding:8px 16px;font-size:12.5px;min-width:0}
.box .ghost{padding:7px 14px;font-size:12.5px}
.row{gap:8px}
.big{font-size:30px;margin:0 0 4px}
.list div{font-size:12.5px;padding:5px 10px}
/* intro: what this is on the left, what to choose on the right. The left column
   is the shorter one, so the long paragraph costs no height at all. */
#ov-intro .box{display:grid;grid-template-columns:1.05fr 1fr;gap:0 16px;text-align:left;align-content:center;
grid-template-areas:"head heroes" "intro heroes" "how hard" "hint play" "rw play"}
#t-intro-h{grid-area:head}#t-intro-p{grid-area:intro}
#t-how{grid-area:how;margin:0 0 4px}#t-keys-touch{grid-area:hint}#rw-open{grid-area:rw;justify-self:start}
.heroes{grid-area:heroes;grid-template-columns:1fr;gap:6px;margin:0}
.hero canvas{height:44px}
.hero b{font-size:12.5px}.hero small{font-size:10.5px;margin-top:1px}
.hard{grid-area:hard;margin:0 0 6px;padding:6px 10px}
.hard b{font-size:12.5px}.hard small{font-size:10.5px}
#ov-intro .row{grid-area:play}
#ov-intro .row .btn{width:100%}
/* end: the result on the left, saving and the board window on the right */
#ov-end .box{display:grid;grid-template-columns:1fr 1.15fr;gap:0 16px;align-content:center;
grid-template-areas:"head name" "text rank" "score list" "btns list"}
#e-h{grid-area:head}#e-p{grid-area:text}#e-score{grid-area:score}
.name{grid-area:name;margin:0 0 6px}
.name input{padding:7px 10px;font-size:13px}
#e-rank{grid-area:rank}
#e-list{grid-area:list;margin:0;max-height:min(40vh,132px);max-height:min(40dvh,132px)}
#ov-end .row{grid-area:btns}
/* board: the heading and Close share a row, so the height goes to the list */
#ov-board .box{display:grid;grid-template-columns:1fr auto;gap:0 12px;
grid-template-areas:"head close" "list list" "note note"}
#t-board{grid-area:head;align-self:center;text-align:left}
#ov-board .row{grid-area:close}
#list{grid-area:list;margin:0 0 6px;max-height:min(52vh,190px);max-height:min(52dvh,190px)}
#b-note{grid-area:note;margin:0}
/* round summary and the scoring table: no column to gain, just less height */
.stats{font-size:12px;gap:2px 16px;margin:0 0 8px}
.stats .x2{font-size:11.5px}
.rwlist{display:grid;grid-template-columns:1fr 1fr;margin:0 0 8px}
.rwlist div{font-size:11.5px;padding:5px 10px}
.rwlist div:nth-last-child(-n+2){border-bottom:0}
}
@media(pointer:coarse) and (orientation:portrait){.rot{display:flex}.arena,.top{visibility:hidden}}
</style>
</head>
<body>
<div class="top">
<a href="../index.html" id="back"><span class="mark nosheen"><img src="../../../brand/saymyfood-mark.png" alt=""></span><span id="t-back">← Back to the request</span></a>
<button class="brd" id="brd">Leaderboard</button>
</div>
<div class="arena">
<div class="zone l">
<div class="rsv" aria-hidden="true"></div>
<div class="lr">
<button data-k="left">◀</button>
<button data-k="right">▶</button>
</div>
<button data-k="gather" id="p-gather">▼</button>
</div>
<div class="frame">
<canvas id="cv" width="960" height="540"></canvas>
<div class="ov" id="ov-intro"><div class="box">
<h2 id="t-intro-h"></h2><p id="t-intro-p"></p>
<div class="heroes">
<button class="hero on" data-h="boy"><canvas width="120" height="120"></canvas><b id="t-boy"></b><small id="t-boy-s"></small></button>
<button class="hero" data-h="girl"><canvas width="120" height="120"></canvas><b id="t-girl"></b><small id="t-girl-s"></small></button>
</div>
<label class="hard"><input type="checkbox" id="hard"><span><b id="t-hard"></b><small id="t-hard-s"></small></span></label>
<div class="row"><button class="btn" id="play"></button></div>
<p class="note" id="t-how"></p>
<p class="note touchhint" id="t-keys-touch"></p>
<button class="lnk" id="rw-open"></button>
</div></div>
<div class="ov" id="ov-clear" hidden><div class="box">
<h2 id="c-h"></h2>
<div class="stats"><span id="t-time"></span><b id="c-time"></b><span id="t-round"></span><b id="c-round"></b><span id="t-hearts"></span><b id="c-hearts"></b><span id="t-bonus"></span><b id="c-bonus"></b><span id="t-earned"></span><b id="c-earned"></b><span class="sum" id="t-lv"></span><b class="sum" id="c-lv"></b><span id="t-all"></span><b id="c-all"></b><span class="x2" id="c-x2" hidden></span></div>
<div class="row"><button class="btn" id="next"></button></div>
</div></div>
<div class="ov" id="ov-end" hidden><div class="box">
<h2 id="e-h"></h2><p id="e-p"></p><div class="big" id="e-score"></div>
<div class="name"><input id="nm" maxlength="24" autocomplete="nickname"><button class="btn" id="save"></button></div>
<p class="note" id="e-rank"></p>
<div class="list" id="e-list" hidden></div>
<div class="row"><button class="ghost" id="again"></button><button class="ghost" id="e-brd"></button></div>
</div></div>
<div class="ov" id="ov-rw" hidden><div class="box">
<h2 id="t-rw-h"></h2><div class="rwlist" id="t-rewards"></div>
<div class="row"><button class="ghost" id="rw-close"></button></div>
</div></div>
<div class="ov" id="ov-board" hidden><div class="box">
<h2 id="t-board"></h2><div class="list" id="list"></div><p class="note" id="b-note"></p>
<div class="row"><button class="ghost" id="b-close"></button></div>
</div></div>
<div class="ov" id="ov-pause" hidden><div class="box">
<h2 id="t-pause-h"></h2>
<div class="row"><button class="btn" id="pz-resume"></button></div>
</div></div>
</div>
<div class="zone r">
<div class="rsv" aria-hidden="true"></div>
<button class="thr" data-k="throw" id="p-throw"><svg viewBox="0 0 40 40" aria-hidden="true"><path d="M5 33.5C8.5 21 18 12.6 28.5 10.2" stroke-dasharray="3.5 4.5"/><circle cx="30.6" cy="10.4" r="5.6" fill="currentColor" stroke="none"/><path d="M30.6 4.8V2.4"/></svg></button></div>
</div>
<div class="rot" id="rot"><div><svg width="44" height="44" viewBox="0 0 24 24"><rect x="7" y="2" width="10" height="20" rx="2"></rect><path d="M20 8a8 8 0 0 1 2 5M4 16a8 8 0 0 1-2-5"></path></svg><span id="t-rot"></span><small id="t-rot-tap" hidden></small></div></div>
<div class="keys" id="t-keys"></div>
<script src="art.js"></script>
<script src="board.js"></script>
<script src="game.js"></script>
<script src="ui.js"></script>
</body>
</html>
